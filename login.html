<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — NeuroNudge</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <a href="/" style="font-family:'Fraunces', serif; font-weight:600; font-size:22px; letter-spacing:-0.02em; color:#1f4436; text-decoration:none;">
  Neuro<span style="color:#5f9484; font-style:italic; font-weight:500;">Nudge</span>
</a>
    <div class="links"><a href="/signup">Sign up</a></div>
  </nav>

  <div class="narrow card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to continue your wellness journey.</p>
    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <button type="submit" class="btn full">Log in</button>
    </form>
    <p class="muted center" style="margin-top:20px;">
      New here? <a href="/signup">Create an account</a>
    </p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
